<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login do Cliente - MIX-PROMOÇÃO</title>
  <link rel="stylesheet" href="./css/login-admin.css">
  <link rel="stylesheet" href="./css/btn-topo.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="./css/responsive.css" />
  <link rel="stylesheet" href="./css/chatbot-widget.css" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>
</head>
<body class="login-bg">
  <header class="logo-topo">
    <div class="logo-box">
      <i class="fas fa-shopping-cart carrinho-icon"></i>
      <span class="logo-text">MIX-PROMOÇÃO</span>
    </div>
  </header>

  <main class="login-container">
    <!-- Status de login cliente (exibido caso já autenticado) -->
    <div id="clienteStatus" style="display:none; align-items:center; gap:18px; margin-bottom: 18px;">
      <img id="fotoCliente" class="foto-perfil" src="" alt="Foto Cliente" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">
      <span id="nomeCliente" class="nome-usuario"></span>
      <button id="btnMinhaConta" class="btn-minha-conta">Minha Conta</button>
      <button id="logoutBtn" class="btn-logout">Sair</button>
    </div>

    <h2>Login do Cliente</h2>
    <form id="formLogin">
      <label for="usuario">Usuário ou E-mail:</label>
      <input type="text" id="usuario" name="usuario" placeholder="Digite seu e-mail ou usuário" required autocomplete="username">

      <label for="senha">Senha:</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">
        <button type="button" id="toggleSenha" class="toggle-senha" tabindex="-1" aria-label="Mostrar ou ocultar senha">
          <i class="fa-solid fa-eye" id="iconeOlho"></i>
        </button>
      </div>

      <button type="submit" id="btnLoginCliente" class="btn-login-admin estiloso">Entrar</button>
      <p id="mensagemErro" class="erro"></p>
    </form>

    <div class="link-cadastro">
      <a href="./cadastro-cliente-novo.html">
        ➕ Não tem conta? Cadastre-se
      </a>
    </div>

    <div class="link-cadastro" style="margin-top: 10px;">
      <a href="./esqueci-senha.html">
        🔑 Esqueci minha senha
      </a>
    </div>

    <!-- 🔹 Opções adicionais de Login Social -->
    <div class="extra-options" style="margin-top: 22px; border-top: 1px solid rgba(19, 35, 54, 0.12); padding-top: 16px;">
      <p style="margin: 0 0 12px; color: var(--login-muted, #5f6b76); font-size: 0.92rem; font-weight: 600; text-align: center;">Ou entre com:</p>
      <div class="social-login" style="display: flex; justify-content: center; gap: 10px;">
        <button class="btn-social facebook" id="btnFacebook" type="button" style="flex:1; padding: 12px 10px; border: none; border-radius: 12px; background: linear-gradient(135deg, #1877F2, #145dbf); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(24,119,242,0.3); transition: transform 0.2s, box-shadow 0.2s;">
          <i class="fa-brands fa-facebook-f"></i> Facebook
        </button>
        <button class="btn-social instagram" id="btnInstagram" type="button" style="flex:1; padding: 12px 10px; border: none; border-radius: 12px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(225,48,108,0.3); transition: transform 0.2s, box-shadow 0.2s;">
          <i class="fa-brands fa-instagram"></i> Instagram
        </button>
      </div>
      <p id="mensagemSocial" class="msg-social" style="min-height: 20px; font-size: 13px; margin-top: 8px;"></p>
    </div>
  </main>

  <style>
    body.login-bg {
      min-height: 100vh;
      background: linear-gradient(270deg, #21cbf3, #2196f3, #ff9800, #ffb347, #21cbf3);
      background-size: 200% 200%;
      animation: gradienteAnimado 8s ease-in-out infinite;
    }
    @keyframes gradienteAnimado {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .login-container::before {
      content: "Área do Cliente" !important;
      color: #0f5db8;
    }
  </style>

  <script src="./js/login-cliente.js" defer></script>
  <script src="./js/auth-links.js" defer></script>
  <script src="./js/login-social.js" defer></script>
  <script src="./js/btn-topo.js" defer></script>
  <script src="./js/bloquear-copia.js" defer></script>
  <script src="./js/chatbot-widget.js" defer></script>
  <script src="./js/responsive-nav.js" defer></script>
</body>
</html>
