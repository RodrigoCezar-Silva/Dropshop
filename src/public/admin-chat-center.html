<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Conversas - MIX-PROMOÇÃO</title>

  <link rel="stylesheet" href="css/style-index.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/admin-chat.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span class="logo-text admin-name">Administrador: Rodrigo Cezar</span>
    </div>

    <nav class="menu" aria-label="Menu principal">
      <ul>
        <li><a href="admin-area.html"><i class="fa-solid fa-house menu-link-icon" aria-hidden="true"></i><span>Area-admin</span></a></li>
        <li><a href="loja.html"><i class="fa-solid fa-store menu-link-icon" aria-hidden="true"></i><span>Nossa Loja</span></a></li>
        <li><a href="admin-reclamacoes.html"><i class="fa-solid fa-envelope menu-link-icon" aria-hidden="true"></i><span>Emails</span></a></li>
        <li><a href="admin-chat-center.html" class="active"><i class="fa-solid fa-comments menu-link-icon" aria-hidden="true"></i><span>Conversas</span></a></li>
      </ul>
    </nav>

    <!-- Botões de login/painel removidos conforme solicitado -->
    <!-- Removed client status and login buttons for admin pages -->
  </header>

  <main class="chat-main">
    <div class="chat-wrap">
      <aside class="chat-sidebar">
        <div class="sidebar-top">
          <div class="sidebar-title">Conversas</div>
          <div class="sidebar-actions">
            <button id="newConvBtn" title="Nova conversa"><i class="fa-solid fa-plus"></i></button>
            <button id="sidebarMenuBtn" title="Menu"><i class="fa-solid fa-ellipsis-vertical"></i></button>
          </div>
        </div>

        <div class="sidebar-search">
          <input id="chatSearch" placeholder="Pesquisar ou começar uma nova conversa..." />
        </div>

        <div class="sidebar-filters">
          <button class="filter active">Tudo</button>
          <button class="filter">Não lidas</button>
          <button class="filter">Favoritas</button>
        </div>

        <div id="conversations" class="conversations"></div>
      </aside>

      <section class="chat-area">
        <header class="chat-header">
          <div class="chat-header-left">
            <div id="chatAvatar" class="chat-avatar">U</div>
            <div class="chat-meta">
              <div id="chatHeaderName">Selecione uma conversa</div>
              <div id="chatHeaderStatus" class="chat-status">visto por último recentemente</div>
            </div>
          </div>
          <div class="chat-header-right">
            <button title="Pesquisar na conversa"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button title="Mais"><i class="fa-solid fa-ellipsis-vertical"></i></button>
          </div>
        </header>

        <div id="messages" class="messages-area"></div>

        <div class="chat-composer">
          <button class="composer-icon" title="Anexar"><i class="fa-solid fa-paperclip"></i></button>
          <input id="msgInput" placeholder="Digite uma mensagem" autocomplete="off" />
          <button id="sendMsgBtn" class="composer-send" title="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/admin-chat-center.js" defer></script>
</body>
</html>
