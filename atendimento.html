<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendimento - MIX-PROMOÇÃO</title>

  <!-- CSS (mesmo do index) -->
  <link rel="stylesheet" href="/css/style-index.css" />
  <link rel="stylesheet" href="/css/style-vitrine.css">
  <link rel="stylesheet" href="/css/carrossel.css" />
  <link rel="stylesheet" href="/css/bannerpromo.css" />
  <link rel="stylesheet" href="/css/carrinho.css" />
  <link rel="stylesheet" href="/css/menu.css" />
  <link rel="stylesheet" href="/css/logo.css" />
  <link rel="stylesheet" href="/css/statusLogin.css" />
  <link rel="stylesheet" href="/css/desconto.css" />
  <link rel="stylesheet" href="/css/minhaConta.css" />
  <link rel="stylesheet" href="/css/btn-topo.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="/css/loja.css" />

  <!-- Ícones Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/chatbot-widget.css" />
  <link rel="stylesheet" href="/css/atendimento.css" />
  
</head>
<body>
  <!-- Cabeçalho (igual ao index) -->
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span class="logo-text">
        <span class="mix">MIX</span><span class="promocao">PROMOÇÃO</span>
      </span>
    </div>

    <!-- Menu -->
    <nav class="menu" aria-label="Menu principal">
      <ul>
        <li><a href="index.html" class="active"><i class="fa-solid fa-house menu-link-icon" aria-hidden="true"></i><span>Início</span></a></li>
        <li><a href="loja.html"><i class="fa-solid fa-store menu-link-icon" aria-hidden="true"></i><span>Nossa Loja</span></a></li>
        <li><a href="QuemSomos.html"><i class="fa-solid fa-circle-info menu-link-icon" aria-hidden="true"></i><span>Sobre</span></a></li>
        <li><a href="trocas-devolucoes.html"><i class="fa-solid fa-right-left menu-link-icon" aria-hidden="true"></i><span>Trocas e Devoluções</span></a></li>
      </ul>
    </nav>

    <!-- Botões de login -->
    <div id="loginButtons">
      <a href="login-cliente.html" class="btn-login cliente">👤 Login Cliente</a>
      <a href="admin-login.html" class="btn-login admin">👤 Login Administrativo</a>
    </div>

    <!-- Status de login administrador -->
    <div id="statusLogado" class="status-admin" style="display:none;">
      <span class="status-text">👑 Logado como administrador: <strong id="nomeUsuario"></strong></span>
      <button id="logout" class="btn-logout">Sair</button>
    </div>

    <!-- Status de login cliente -->
    <div id="clienteStatus" style="display:none;">
      <img id="fotoCliente" class="foto-perfil" src="" alt="Foto Cliente">
      <span id="nomeCliente"></span>
      <span id="sobrenomeCliente"></span>
      <button id="btnMinhaConta" class="btn-minha-conta">Minha Conta</button>
      <button id="logoutBtn" class="btn-logout">Sair</button>
    </div>

    <!-- Ícone do carrinho -->
    <a href="carrinho.html" class="cart-icon" aria-label="Carrinho de Compras">
      <i class="fas fa-shopping-cart"></i>
      <span id="cart-count">0</span>
    </a>
  </header>

  <main class="atendimento-page">
    <div class="atendimento-app">
      <aside class="conversations" aria-label="Conversas">
        <div class="conversations-header">
          <h3>Conversas</h3>
          <div class="conv-actions">
            <button id="newConv" title="Nova conversa">+</button>
          </div>
        </div>
        <div class="conv-search">
          <input id="searchConv" placeholder="Pesquisar conversas..." aria-label="Pesquisar conversas" />
        </div>
        <div id="listaConversas" class="lista-conversas">
          <div class="empty">Nenhuma conversa<br><span>Quando um cliente iniciar um atendimento, a conversa aparecerá aqui.</span></div>
        </div>
      </aside>

      <section class="chat-panel" role="region" aria-label="Painel de mensagens">
        <div class="chat-panel-header">
          <div id="currentConvName" class="conv-name">Selecione uma conversa</div>
        </div>

        <div id="mensagens" class="mensagens" role="log" aria-live="polite" aria-atomic="false"></div>

        <div class="chat-input-bar">
          <button id="attachBtn" class="attach" title="Anexar"><i class="fa-regular fa-paperclip"></i></button>
          <input id="inputMsg" type="text" placeholder="Digite uma mensagem" autocomplete="off" maxlength="800" aria-label="Mensagem" />
          <button id="btnEnviar" class="send" type="button">Enviar</button>
        </div>
      </section>
    </div>
  </main>

  <!-- footer removido para página de atendimento -->

  <!-- Scripts (mesmos do index) -->
  <script src="/js/carrossel.js"></script>
  <script src="/js/carrinho.js"></script>
  <script src="/js/VoltaraoTopo.js"></script>
  <script src="/js/script-vitrine.js"></script>
  <script src="/js/statusLogin.js"></script>
  <script src="/js/meu-perfil.js"></script>
  <script src="/js/login-cliente.js"></script>
  <script src="/js/logo.js"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/btn-topo.js"></script>
  <script src="/js/bloquear-copia.js"></script>
  <script src="/js/promo-carousel.js"></script>
  <script src="/js/responsive-nav.js"></script>
  <script src="/js/fit-hero.js"></script>
  <script src="/js/chatbot-widget.js"></script>
  <!-- For development: when page is served by Live Server, force API to localhost:3000 so chats persist to DB -->
  <script>
    (function(){
      try{
        if(!window.__API_BASE__){
          // if current origin is not the Node server, point API to Node
          const port = location.port || '';
          if(port && String(port) !== '3000'){
            window.__API_BASE__ = 'http://localhost:3000';
          }
        }
      }catch(e){}
    })();
  </script>
  <script src="/js/atendimento.js"></script>
</body>
</html>
